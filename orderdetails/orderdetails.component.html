<section class="main" [class.details-expanded]="detailsExpanded()" xc-i18n-context="pmon.orderdetails">
  @if (workflow()) {
    <div class="workflow-container" dataflow-container>
      @if (dataflowReady()) {
        <dataflow [dataflow]="dataflow()"
          [workflow]="workflow()"
         />
      }
      <variable-area-document [variableArea]="workflow().inputArea" xc-variable-area-kind="input-area"
        [documentModel]="document()"
       />
      <type-label-area [typeLabelArea]="workflow().typeLabelArea"
        [menuItems]="menuItems"
        [menuTemplateRef]="menuTemplate"
        [documentModel]="document()"
       />
      <workflow [workflow]="workflow()"
        [documentModel]="document()"
        (initialized)="workflowInitialized($event)"
        class="zeta-scrollbar"
       />
      <exception-handling-area [exceptionHandlingArea]="workflow().exceptionHandlingArea"
        [documentModel]="document()"
       />
      <variable-area-document [variableArea]="workflow().outputArea" xc-variable-area-kind="output-area"
        [documentModel]="document()"
       />
    </div>
  }
  @if (!workflow()) {
    <label xc-i18n class="no-audit-available">
      label-no-data
    </label>
  }
  <xfm-mon-audit-details xc-i18n-context="audit-details"
    [fqn]="workflowFqn()"
    [workflowOrderId]="workflow()?.orderId"
    [parentOrderId]="parentOrderId()"
    [disabled]="isImportedAudit"
    (openAudit)="openAudit($event)"
    class="details-footer"
    (refreshAudit)="refreshAudit()"
   />
</section>
<xc-panel class="details-right" [class.expanded]="detailsExpanded()" xc-i18n-context="pmon.orderdetails">
  <header>
    <xc-icon-button xc-i18n
    xc-icon-name="{{detailsExpanded() ? 'arrowright' : 'arrowleft'}}" xc-icon-size="small" color="normal"
      xc-tooltip="tooltip-expand-shrink-details"
    (click)="detailsExpanded.set(!detailsExpanded())"
     />
    <h1 xc-i18n>header-details</h1>
    <div class="items-right">
      <xc-icon-button (click)="refreshAudit()" xc-tooltip="Refresh Audit" xc-icon-tooltip="Refresh" class="refresh" xc-icon-name="reload" />
    </div>
  </header>
  <section class="stretch scroll zeta-scrollbar">
    <xfm-mon-runtime-info xc-i18n-context="runtime-info"
      [runtimeInfo]="runtimeInfo()"
      [iterationDepth]="0"
      [lazyLoadingLimit]="lazyLoadingLimit()"
     />
  </section>
</xc-panel>
@if (pending()) {
  <div class="pending">
    <xc-spinner color="primary" />
  </div>
}
<ng-template #menuTemplate>
  <xc-icon-button *xc-menu-service="showMenu; let menuService"
    [xc-menu-trigger]="menuService.component"
    (xc-menu-trigger)="menuService.set(menuItems, {withArrow: true, xNexttoTrigger: true, xOffset: 8})"
    xc-icon-name="misc-contextmenu"
    xc-icon-style="modeller"
    xc-icon-size="small"
    class="menu-button"
   />
</ng-template>
